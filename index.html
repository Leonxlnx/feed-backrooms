<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Backrooms horror. You are the monster.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FEED">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>FEED</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #b9b1a0;
    font-family: "Times New Roman", Times, serif; user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

  .screen { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 24px; box-sizing: border-box;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.5) 0%, rgba(0,0,0,.92) 68%, #000 100%);
    transition: opacity 1.4s ease; }
  .hidden { opacity: 0; pointer-events: none; }

  h1 { font-weight: 400; font-size: clamp(64px, 14vw, 200px); line-height: 1; letter-spacing: .4em; margin: 0 0 0 .4em;
    color: #8f0e0e; text-shadow: 0 0 34px rgba(170,0,0,.5), 0 0 3px #400; animation: flick 6.1s infinite; }
  h2 { font-weight: 400; font-size: clamp(30px, 6vw, 84px); letter-spacing: .34em; margin: 0 0 0 .34em;
    color: #8f0e0e; text-shadow: 0 0 30px rgba(170,0,0,.45); animation: flick 7.3s infinite; }
  .sub { font-style: italic; font-size: clamp(14px, 1.6vw, 20px); letter-spacing: .32em; margin: 34px 0 0 .32em;
    color: #8a8373; text-transform: lowercase; }
  .go { font-size: 13px; letter-spacing: .6em; margin: 64px 0 0 .6em; text-transform: uppercase; color: #cfc7b4;
    animation: breathe 2.8s ease-in-out infinite; }
  .keys { position: absolute; bottom: 34px; left: 0; right: 0; font-size: 11px; letter-spacing: .34em;
    text-transform: uppercase; color: #5d584d; line-height: 2.1; }
  .keys b { font-weight: 400; color: #8f867a; }

  #hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; transition: opacity 1.5s; }
  #tally { position: absolute; left: 34px; bottom: 26px; font-size: 30px; letter-spacing: 9px; color: #b9b1a0; opacity: .75;
    text-shadow: 0 0 6px #000; }
  #tally s { color: #8f0e0e; text-decoration-thickness: 2px; text-shadow: 0 0 8px rgba(170,0,0,.7); }
  #hunger, #stam { position: absolute; left: 50%; transform: translateX(-50%); width: 230px; background: rgba(255,255,255,.07); }
  #hunger { bottom: 36px; height: 2px; }
  #stam { bottom: 30px; height: 1px; transition: opacity .6s; }
  #hunger i, #stam i { display: block; height: 100%; width: 100%; transform-origin: left center; }
  #hunger i { background: #9a1010; box-shadow: 0 0 9px rgba(190,0,0,.8); }
  #stam i { background: #8a8373; }
  #msg { position: absolute; left: 0; right: 0; bottom: 17%; text-align: center; font-style: italic; font-size: clamp(15px, 1.7vw, 22px);
    letter-spacing: .34em; padding-left: .34em; text-transform: lowercase; color: #c9c0ae; opacity: 0; transition: opacity 1.1s;
    text-shadow: 0 0 12px #000, 0 0 2px #000; }

  /* ---- phones / tablets: thumb controls, HUD moved out from under the thumbs ---- */
  #touch { position: fixed; inset: 0; z-index: 4; display: none; transition: opacity .8s; }
  body.touch #touch { display: block; }
  #touch.hidden { opacity: 0; pointer-events: none; }
  #stick { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; pointer-events: none;
    border: 1px solid rgba(185,177,160,.26); background: rgba(0,0,0,.2); opacity: 0; transition: opacity .2s; }
  #stick.on { opacity: 1; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
    background: rgba(185,177,160,.2); border: 1px solid rgba(185,177,160,.42); }
  #stick.run { border-color: rgba(190,30,30,.55); }
  #stick.run i { background: rgba(154,16,16,.5); border-color: rgba(210,40,40,.8); }
  #touch button { position: absolute; border-radius: 50%; border: 1px solid rgba(185,177,160,.3); background: rgba(0,0,0,.3);
    color: #b9b1a0; font: italic 12px "Times New Roman", Times, serif; letter-spacing: .2em; padding: 0 0 0 .2em;
    -webkit-appearance: none; appearance: none; outline: none; touch-action: none; }
  #touch button.down { background: rgba(154,16,16,.45); border-color: rgba(210,40,40,.85); color: #fff; }
  #bAtk { right: calc(26px + env(safe-area-inset-right)); bottom: calc(30px + env(safe-area-inset-bottom)); width: 94px; height: 94px;
    border-color: rgba(170,20,20,.6) !important; font-size: 14px !important; }
  #bRoar { right: calc(134px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 62px; height: 62px; }
  #bSmell { right: calc(42px + env(safe-area-inset-right)); bottom: calc(138px + env(safe-area-inset-bottom)); width: 62px; height: 62px; }
  #rotate { display: none; z-index: 9; background: #000; }
  @media (orientation: portrait) { body.touch #rotate { display: flex; } }
  body.touch h1 { font-size: clamp(48px, 11vw, 120px); }
  body.touch .sub { margin-top: 16px; font-size: 13px; }
  body.touch .go { margin-top: 26px; }
  body.touch .keys { bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 9px; line-height: 1.9; letter-spacing: .26em; }
  body.touch #tally { left: calc(18px + env(safe-area-inset-left)); top: 10px; bottom: auto; font-size: 22px; letter-spacing: 6px; }
  body.touch #hunger { bottom: 15px; width: 180px; }
  body.touch #stam { bottom: 10px; width: 180px; }
  body.touch #msg { bottom: 24%; font-size: 15px; }

  @keyframes flick {
    0%, 100% { opacity: 1; } 3% { opacity: .35; } 4% { opacity: 1; } 41% { opacity: 1; } 42% { opacity: .1; } 43% { opacity: .85; }
    44% { opacity: .3; } 46% { opacity: 1; } 78% { opacity: 1; } 79% { opacity: .55; } 80% { opacity: 1; }
  }
  @keyframes breathe { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
</style>
</head>
<body>
  <div id="hud" class="hidden">
    <div id="tally"></div>
    <div id="hunger"><i></i></div>
    <div id="stam"><i></i></div>
    <div id="msg"></div>
  </div>

  <div id="touch" class="hidden">
    <div id="stick"><i></i></div>
    <button id="bSmell">smell</button>
    <button id="bRoar">roar</button>
    <button id="bAtk">tear</button>
  </div>

  <div id="rotate" class="screen">
    <h2>TURN</h2>
    <p class="sub">hold your phone sideways</p>
  </div>

  <div id="title" class="screen">
    <h1>FEED</h1>
    <p class="sub">they wandered in. you were already here.</p>
    <p class="go" id="go">waking</p>
    <div class="keys" id="keys">
      <b>W A S D</b> stalk &nbsp;·&nbsp; <b>shift</b> run them down &nbsp;·&nbsp; <b>click</b> tear<br>
      <b>hold right click</b> smell their fear &nbsp;·&nbsp; <b>R</b> roar &nbsp;·&nbsp; <b>1 / 2</b> faster / sharper
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <h2>IT WAITS</h2>
    <p class="go">click to return</p>
  </div>

  <div id="end" class="screen hidden">
    <h2 id="endTitle"></h2>
    <p class="sub" id="endSub"></p>
    <p class="go">click to wake again</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
